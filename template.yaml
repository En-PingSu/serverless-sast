AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAST Security Scanner - Serverless scan pipeline for GitHub repos

Parameters:
  GitHubWebhookSecret:
    Type: String
    NoEcho: true
    Description: Secret used to verify GitHub webhook signatures
  GitHubToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: GitHub personal access token for cloning private repos (optional)

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref ScansTable
        S3_REPORTS_BUCKET: !Ref ReportsBucket

Resources:

  # ============================================================
  # API Gateway - single HTTP API for webhooks and dashboard
  # ============================================================
  ScannerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Hub-Signature-256
          - X-GitHub-Event

  # ============================================================
  # SQS Queue - buffers scan jobs during traffic spikes
  # ============================================================
  ScanJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sast-scan-jobs
      VisibilityTimeout: 330  # slightly more than scanner Lambda timeout
      MessageRetentionPeriod: 86400  # 24 hours
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScanJobDLQ.Arn
        maxReceiveCount: 3

  ScanJobDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sast-scan-jobs-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  # ============================================================
  # SNS Topics - security notifications
  # ============================================================
  SastSecurityFindingsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: sast-security-findings

  # ============================================================
  # DynamoDB Table - scan metadata for fast queries
  # ============================================================
  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sast-scans
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: repoName
          AttributeType: S
        - AttributeName: scanId
          AttributeType: S
      KeySchema:
        - AttributeName: repoName
          KeyType: HASH
        - AttributeName: scanId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: scanId-index
          KeySchema:
            - AttributeName: scanId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ============================================================
  # S3 Bucket - full scan reports (JSON)
  # ============================================================
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'sast-reports-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  # ============================================================
  # Lambda 1 - Webhook Handler
  # Receives GitHub webhooks, validates signature, enqueues scan job
  # ============================================================
  WebhookHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      FunctionName: sast-webhook-handler
      CodeUri: src/webhook-handler/
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref ScanJobQueue
          GITHUB_WEBHOOK_SECRET: !Ref GitHubWebhookSecret
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ScanJobQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref ScansTable
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref ScannerApi
            Path: /webhook
            Method: POST

  # ============================================================
  # Lambda 2 - Scanner (Container Image)
  # Clones repo, runs SAST scanner, stores results
  # ============================================================
  ScannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      FunctionName: sast-scanner
      PackageType: Image
      MemorySize: 1024
      Timeout: 300
      Runtime: null
      Handler: null
      Environment:
        Variables:
          GITHUB_TOKEN: !Ref GitHubToken
          SNS_SECURITY_FINDINGS_TOPIC_ARN: !Ref SastSecurityFindingsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScansTable
        - S3CrudPolicy:
            BucketName: !Ref ReportsBucket
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SastSecurityFindingsTopic
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ScanJobQueue.Arn
            BatchSize: 1
    Metadata:
      DockerTag: latest
      DockerContext: ./src/scanner
      Dockerfile: Dockerfile

  # ============================================================
  # Lambda 3 - Query API
  # Dashboard backend: list scans, get details, get reports
  # ============================================================
  QueryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      FunctionName: sast-query-api
      CodeUri: src/query-api/
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ScansTable
        - S3ReadPolicy:
            BucketName: !Ref ReportsBucket
      Events:
        ListScans:
          Type: HttpApi
          Properties:
            ApiId: !Ref ScannerApi
            Path: /scans
            Method: GET
        GetScan:
          Type: HttpApi
          Properties:
            ApiId: !Ref ScannerApi
            Path: /scans/{scanId}
            Method: GET
        GetReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref ScannerApi
            Path: /scans/{scanId}/report
            Method: GET
        GetStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref ScannerApi
            Path: /stats
            Method: GET

  # ============================================================
  # Lambda 4 - DLQ notifier
  # Triggered when a scan job message reaches SQS DLQ.
  # Publishes scan failure details to SNS.
  # ============================================================
  DLQNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole'
      FunctionName: sast-dlq-notifier
      CodeUri: src/dlq-notifier/
      Handler: index.handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SNS_SECURITY_FINDINGS_TOPIC_ARN: !Ref SastSecurityFindingsTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref SastSecurityFindingsTopic
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ScansTable.Arn
      Events:
        ScanJobDLQTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ScanJobDLQ.Arn
            BatchSize: 1

  # ============================================================
  # CloudWatch Alarms
  # ============================================================
  ScanFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sast-scan-failure-rate
      AlarmDescription: Fires when scan failures exceed 2 in 5 minutes
      Namespace: SASTScanner
      MetricName: ScanFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SastSecurityFindingsTopic

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sast-dlq-depth
      AlarmDescription: Fires when messages appear in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScanJobDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SastSecurityFindingsTopic

  HighSeverityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sast-high-severity-findings
      AlarmDescription: Fires when HIGH severity vulnerabilities are detected
      Namespace: SASTScanner
      MetricName: HighSeverityFindings
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SastSecurityFindingsTopic

  ScanDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sast-scan-duration-high
      AlarmDescription: Fires when average scan duration exceeds 60 seconds
      Namespace: SASTScanner
      MetricName: ScanDuration
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 60000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SastSecurityFindingsTopic

  # ============================================================
  # CloudWatch Ops Dashboard
  # ============================================================
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: sast-scanner-ops
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Scan Completion vs Failure",
                "metrics": [
                  ["SASTScanner", "ScanCompleted", { "stat": "Sum", "label": "Completed", "color": "#2ca02c" }],
                  ["SASTScanner", "ScanFailed", { "stat": "Sum", "label": "Failed", "color": "#d62728" }]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Scan Duration (ms)",
                "metrics": [
                  ["SASTScanner", "ScanDuration", { "stat": "Average", "label": "Avg Duration" }],
                  ["SASTScanner", "ScanDuration", { "stat": "Maximum", "label": "Max Duration", "color": "#ff7f0e" }]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Vulnerabilities Found",
                "metrics": [
                  ["SASTScanner", "VulnerabilitiesFound", { "stat": "Sum", "label": "Total Vulns" }],
                  ["SASTScanner", "HighSeverityFindings", { "stat": "Sum", "label": "HIGH", "color": "#d62728" }]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "SQS Queue Depth",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "sast-scan-jobs", { "label": "Main Queue" }],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "sast-scan-jobs-dlq", { "label": "DLQ", "color": "#d62728" }]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "sast-scanner", { "label": "Scanner" }],
                  ["AWS/Lambda", "Invocations", "FunctionName", "sast-webhook-handler", { "label": "Webhook Handler" }],
                  ["AWS/Lambda", "Errors", "FunctionName", "sast-scanner", { "label": "Scanner Errors", "color": "#d62728" }]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration (ms)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "sast-scanner", { "stat": "Average", "label": "Scanner Avg" }],
                  ["AWS/Lambda", "Duration", "FunctionName", "sast-scanner", { "stat": "Maximum", "label": "Scanner Max", "color": "#ff7f0e" }]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            }
          ]
        }

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ScannerApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  WebhookUrl:
    Description: URL to configure as GitHub webhook
    Value: !Sub 'https://${ScannerApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook'

  ReportsBucket:
    Description: S3 bucket for scan reports
    Value: !Ref ReportsBucket

  ScansTable:
    Description: DynamoDB table for scan metadata
    Value: !Ref ScansTable

  OpsDashboardUrl:
    Description: CloudWatch ops dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=sast-scanner-ops'
